<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- 体験参加カードなどに載せる「教室の入口」。飛び先を変えるときはこのファイルの2か所(meta refresh と TARGET)を直す -->
<meta http-equiv="refresh" content="0; url=https://app.noiz.fun/login">
<title>ログイン — オンラインデイサービス長老大学</title>
<style>
  :root { --bg: #f6f3ee; --card: #fff; --ink: #2b1a0a; --sub: #7a5a3a; --accent: #c44600; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
         background: var(--bg); color: var(--ink); font-size: 20px; line-height: 1.7; }
  main { max-width: 560px; margin: 48px auto; padding: 24px; background: var(--card); border-radius: 12px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  a.btn { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 10px;
          background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
  p.sub { color: var(--sub); font-size: 16px; }
</style>
<script>
  var TARGET = "https://app.noiz.fun/login";
  location.replace(TARGET);
</script>
</head>
<body>
<main>
  <h1>オンラインデイサービス長老大学</h1>
  <p>ログイン画面へ移動しています。</p>
  <a class="btn" href="https://app.noiz.fun/login">ログイン画面へ進む</a>
  <p class="sub">画面が変わらないときは、上のボタンを押してください。</p>
</main>
</body>
</html>
